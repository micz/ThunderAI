name: Delete Vendor Library Update Branches

# Deletes the branch of a vendor library update PR once it is merged.
# Only the branches the library workflows create are touched:
#   - <package>-update-<version>, from the daily release checks
#   - libs-update-<base branch>, from libs-update.yml
# and only when the PR was opened by those workflows (github-actions[bot]).

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete the merged branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          # Keep the package list in sync with the matrix of the release check workflow
          if ! [[ "$BRANCH" =~ ^((tom-select|markdown-it|idb|diff)-update-[0-9]|libs-update-) ]]; then
            echo "Branch '${BRANCH}' is not a vendor library update branch. No action taken."
            exit 0
          fi

          # The branch may already be gone (deleted by hand, or by the repository setting)
          if ! gh api "repos/${REPO}/git/ref/heads/${BRANCH}" --silent 2>/dev/null; then
            echo "Branch '${BRANCH}' no longer exists. No action taken."
            exit 0
          fi

          gh api -X DELETE "repos/${REPO}/git/refs/heads/${BRANCH}"
          echo "Branch '${BRANCH}' deleted."
