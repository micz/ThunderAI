name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-configuration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # node --test expands a quoted glob itself only from Node 21 on.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run the test suite
        run: node --test "tests/**/*.test.mjs"
