name: Tests

# On demand only, never on every commit: run it by hand (Actions → Tests → Run workflow,
# or `gh workflow run tests.yml --ref <branch>`), or add the `run-tests` label to a pull
# request. The label is removed when the run ends, so adding it again runs the suite again.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-configuration:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-tests'
    runs-on: ubuntu-latest
    # The whole suite takes a few minutes; a hung run must not sit until GitHub's 6-hour limit.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # node --test expands a quoted glob itself only from Node 21 on; jsdom (the DOM
        # tests' one dev dependency) needs 22.22+ / 24.15+.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Before installing anything: the level-1 suite must keep running with no install.
      - name: Level-1 suite, no dependencies
        run: node --test --test-timeout=120000 "tests/**/*.test.mjs"
      - name: Install the development tooling
        run: npm ci
      - name: Whole suite (level 1 and DOM tests)
        run: npm test

  unlabel:
    needs: managed-configuration
    if: always() && github.event_name == 'pull_request' && github.event.label.name == 'run-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove the run-tests label
        # The REST call needs only pull-requests: write (gh pr edit goes through GraphQL, which can
        # ask for more). A label already gone (removed by hand meanwhile) is not an error.
        run: |
          if ! out=$(gh api -X DELETE "repos/${REPO}/issues/${PR}/labels/run-tests" 2>&1); then
            case "$out" in
              *"HTTP 404"*|*"Label does not exist"*) echo "The run-tests label is already gone." ;;
              *) echo "$out"; exit 1 ;;
            esac
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        # On a pull request from a fork the token is read-only: the label stays, and the run does not
        # fail for it. On this repository's own pull requests a failure here is a real one, and shows.
        continue-on-error: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
