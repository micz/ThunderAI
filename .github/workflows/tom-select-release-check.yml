name: Check Tom-Select Latest Release

on:
  schedule:
    - cron: '0 19 * * *' # Check every day at 19:00
  workflow_dispatch: # Allows manual triggering for testing purposes

permissions:
  contents: read
  issues: write

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest release from npm registry
        id: get_release
        run: |
          # Read npm (what the CDN serves), not GitHub releases, which can be published before npm
          PACKAGE_TARGET="tom-select"
          LATEST_VERSION=$(curl -s https://registry.npmjs.org/$PACKAGE_TARGET/latest | jq -r .version)

          if [ "$LATEST_VERSION" == "null" ] || [ -z "$LATEST_VERSION" ]; then
            echo "Error: unable to fetch version or no release found."
            exit 1
          fi

          echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "target=$PACKAGE_TARGET" >> $GITHUB_OUTPUT

      - name: Check if Issue already exists and create it
        uses: actions/github-script@v7
        with:
          script: |
            const latestVersion = "${{ steps.get_release.outputs.version }}";
            const targetPackage = "${{ steps.get_release.outputs.target }}";
            const { owner, repo } = context.repo;
            const issueTitle = `Update Tom Select to version ${latestVersion}`;

            // Skip if VENDORS.md already points to the latest version (with or without the "v" prefix)
            const vendors = await github.rest.repos.getContent({ owner, repo, path: 'VENDORS.md' });
            const vendorsText = Buffer.from(vendors.data.content, 'base64').toString('utf8');
            if (vendorsText.includes(`${targetPackage}@${latestVersion}/`) || vendorsText.includes(`${targetPackage}@v${latestVersion}/`)) {
              core.info(`Tom Select is already at version ${latestVersion}. No action taken.`);
              return;
            }

            // Search through issues (both open and closed for safety)
            const response = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue "${issueTitle}"`,
            });

            if (response.data.total_count > 0) {
              core.info(`The issue for version ${latestVersion} already exists. No action taken.`);
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: issueTitle,
                labels: ['enhancement'],
                body: `Update Tom Select to version  **${latestVersion}**.

                https://cdn.jsdelivr.net/npm/${targetPackage}@${latestVersion}/dist/js/tom-select.base.js

                https://cdn.jsdelivr.net/npm/${targetPackage}@${latestVersion}/dist/css/tom-select.default.min.css

            Change the VENDORS.md file on the dev branch to trigger the library update.`
              });
              core.info(`New issue created for version ${latestVersion}.`);
            }
