name: Sync CHANGELOG.md

# CHANGELOG.md is generated from options/mzta-release-notes.html, never edited by hand: on every
# push that touches the release notes, the changelog is regenerated and committed to the same
# branch. Pull before pushing again. The bot's push (GITHUB_TOKEN) does not trigger workflows,
# so this never runs on its own commit.
on:
  workflow_dispatch:
  push:
    paths:
      - 'options/mzta-release-notes.html'

permissions:
  contents: write

concurrency:
  group: changelog-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog-sync:
    # On a fork the token cannot write: nothing to do there.
    if: github.repository == 'micz/ThunderAI'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate CHANGELOG.md
        run: node .github/scripts/changelog-sync.mjs

      - name: Commit and push to the same branch
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already in line, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "CHANGELOG.md synced from the release notes"
          # A push to the branch since the checkout: replay the sync commit on top of it.
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
