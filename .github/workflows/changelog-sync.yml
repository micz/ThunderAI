name: Sync CHANGELOG.md

# CHANGELOG.md is generated from options/mzta-release-notes.html, never edited by hand: on every
# push that touches the release notes, the changelog is regenerated and committed to the same
# branch. Pull before pushing again. The commit is created through the GitHub API
# (createCommitOnBranch, via ghcommit) on the current tip of the branch, so GitHub signs it and
# it shows as Verified, and no local rebase is needed. The bot's push (GITHUB_TOKEN) does not
# trigger workflows, so this never runs on its own commit.
on:
  workflow_dispatch:
  push:
    paths:
      - 'options/mzta-release-notes.html'

permissions:
  contents: write

concurrency:
  group: changelog-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog-sync:
    # On a fork the token cannot write: nothing to do there.
    if: github.repository == 'micz/ThunderAI'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate CHANGELOG.md
        run: node .github/scripts/changelog-sync.mjs

      # Nothing is committed when CHANGELOG.md is unchanged.
      - name: Commit and push to the same branch
        uses: planetscale/ghcommit-action@v0.2.22
        with:
          commit_message: "CHANGELOG.md synced from the release notes"
          repo: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          file_pattern: 'CHANGELOG.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
