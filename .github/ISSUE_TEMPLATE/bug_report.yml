name: Bug Report
description: Create a report to help ThunderAI improve.
body:
  - type: markdown
    attributes:
      value: |
        This issue form is for reporting bugs only!

        > [!IMPORTANT]
        > **The error log is required.** Activate the ThunderAI debug log in the advanced option panel, reproduce the problem, then copy the log from the Thunderbird error console.
        >
        > 🎬 **[Watch the video: how to save the error log][vd]**

        If you have a feature or enhancement request, please use the [feature request][fr] form.

        [fr]: https://github.com/micz/ThunderAI/issues/new?assignees=&labels=&projects=&template=feature_request.yml&title=
        [vd]: https://micz.it/thunderbird-error-console/
  - type: textarea
    validations:
      required: true
    id: problem
    attributes:
      label: The problem
      description: >-
        Describe the issue you are experiencing here. Tell us what you were trying to do and what happened.

        Provide a clear and concise description of what the problem is.
  - type: textarea
    id: logs
    validations:
      required: true
    attributes:
      label: Thunderbird console logs
      description: >-
        Paste the error messages or stack traces from the Thunderbird error console (CTRL+SHIFT+J), with the ThunderAI debug log activated in the add-on preferences.

        🎬 **[Watch the video: how to save the error log](https://micz.it/thunderbird-error-console/)**
      render: txt
  - type: markdown
    attributes:
      value: |
        ## Environment
  - type: input
    validations:
      required: true
    attributes:
      label: Which Operative System are you using?
      description: >
        Like Windows 10 or MacOSX.
  - type: input
    validations:
      required: true
    attributes:
      label: Which version of Thunderbird are you using?
      description: >
        Thunderbird version like 153.0 or 159.0.1.
  - type: input
    id: version
    validations:
      required: true
    attributes:
      label: Which version of ThunderAI has the issue?
      description: >
        ThunderAI version like 5.1.0.
  - type: dropdown
    validations:
      required: true
    id: integration
    attributes:
      label: Which integration are you using?
      options:
        - -- Select an option --
        - ChatGPT Web Interface
        - OpenAI ChatGPT API
        - Google Gemini API
        - Claude API
        - Ollama API
        - OpenAI Compatible API
  - type: markdown
    attributes:
      value: |
        # Details
  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: >
        If you have any additional information, use the field below.
        Please note, you can attach screenshots or screen recordings here, by
        dragging and dropping files in the field below.
