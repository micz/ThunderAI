<!DOCTYPE html>
<html>
<head>
    <!-- Defense in depth for the model output shown in the transcript (issue #1001), on top of
         the sanitizer and of the manifest's default CSP. connect-src allows any http(s) host:
         the context-window lookup (contextWindow.js) fetches from this page, at a user-defined
         host for Ollama. No inline style either: the components use adoptedStyleSheets. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' http: https:; worker-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
    <meta charset="utf-8">
    <title>ThunderAI</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <div id="appContainer">
        <div id="appHeader">
            <span id="appHeaderBrand">
                <span id="appHeaderLogo"><span id="appHeaderShield" hidden></span></span>
                <span id="appHeaderName">ThunderAI</span>
            </span>
            <span id="appHeaderModel"></span>
            <span id="appHeaderApi" hidden><span class="pill_dot"></span><span id="appHeaderApiName"></span></span>
        </div>
        <messages-area></messages-area>
        <message-input></message-input>
    </div>

    <!-- Include the JavaScript files at bottom to avoid blocking UI -->
    <script src="messageInput.js" type="module" defer></script>
    <script src="markdown-it.min.js"></script>
    <script src="../js/lib/diff.js"></script>
    <!-- Classic script: defines the rich-text projection globals (mztaHtmlToLines,
         mztaNormalizePlain, mztaLinesToHtml, ...) that js/mzta-utils.js reaches
         through globalThis. Same pattern as markdown-it and diff.js above; must
         load before the module scripts below that transitively call them. -->
    <script src="../js/lib/mzta-html-lines.js"></script>
    <script src="messagesArea.js" type="module" defer></script>
    <script src="controller.js" type="module" defer></script>
</body>
</html>
