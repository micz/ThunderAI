     (spec 04 "Model verification"): a Radix id and the display name in a <span> under it. -->
<main>
  <button id="radix-:r2:" type="button" aria-haspopup="menu" aria-expanded="false" data-state="closed"

  <div id="prompt-textarea" class="ProseMirror" contenteditable="true" role="textbox" style="min-height:30px"></div>
